name: ci

on: push

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    # The smoke suite needs Postgres and Redis (task queues). It points Qdrant, Ollama and every
    # outbound HTTPS call at an unreachable address, so no other service is required.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # exactly what pnpm-lock.yaml says; a lockfile out of step with package.json fails here
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # Builds the production bundle, then runs unit tests and the API smoke suite against it.
      - name: Test (production build)
        run: pnpm run test:build
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hr_onboarding_test
          TEST_REDIS_URL: redis://localhost:6379/15
          NODE_OPTIONS: --max-old-space-size=8192

  # The image docker compose runs: it must keep building from a clean checkout
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build the app image
        run: docker build -t hr-onboarding:ci .

      - name: Check the compose file
        run: |
          touch .env
          docker compose --profile ollama --profile split config --quiet
